name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "alembic/**"
      - "tests/**"
      - "Dockerfile"
      - "requirements.txt"
      - "alembic.ini"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.ACR_LOGIN_SERVER }}/rag-app-backend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── Job 1: Run Tests ────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          SECRET_KEY: test-secret-key-for-ci-only
          DATABASE_URL: postgresql+asyncpg://u:p@localhost/testdb
          REDIS_URL: redis://localhost:6379
          AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KCo4HkGEsLJDHLAxlMJEHF6QOZ3iXKJEJBuiLhQ==;BlobEndpoint=http://localhost:10000/devstoreaccount1;"
          WEAVIATE_URL: https://test.weaviate.cloud
          WEAVIATE_API_KEY: test-key
          OPENAI_API_KEY: sk-test-key

  # ── Job 2: Build & Push to ACR ──────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image to ACR
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to Azure Container Apps ───────────────────────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ secrets.BACKEND_APP_NAME }}
          imageToDeploy: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          registryUrl: ${{ secrets.ACR_LOGIN_SERVER }}
          registryUsername: ${{ secrets.ACR_USERNAME }}
          registryPassword: ${{ secrets.ACR_PASSWORD }}
          environmentVariables: >
            APP_ENV=production
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
            AZURE_STORAGE_CONTAINER=rag-documents
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            WEAVIATE_URL=${{ secrets.WEAVIATE_URL }}
            WEAVIATE_API_KEY=${{ secrets.WEAVIATE_API_KEY }}
            ALLOWED_ORIGINS=["${{ secrets.FRONTEND_URL }}"]

      - name: Verify deployment health
        run: |
          echo "Waiting 30s for container to start..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.BACKEND_URL }}/health)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Backend health check passed (HTTP $STATUS)"
          else
            echo "❌ Backend health check failed (HTTP $STATUS)"
            exit 1
          fi
